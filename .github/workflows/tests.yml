name: tests

on:
  push:
    branches: [main, mainline]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src/robot_dynamics --ignore-missing-imports || true

      - name: Test
        run: pytest tests -q

      - name: Numerical-layer purity check
        # The numerical path must never import SymPy. Enforced in CI as well as in
        # the test suite, because it is an architectural guarantee rather than a
        # behaviour and is easy to break by accident.
        run: |
          ! grep -rn "import sympy" src/robot_dynamics/dynamics/lagrangian.py \
                                    src/robot_dynamics/dynamics/rnea.py \
                                    src/robot_dynamics/dynamics/crba.py

      - name: Examples still run
        run: |
          cd examples
          for f in 0*.py; do python "$f" > /dev/null; done

  validation-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regenerate the validation report and fail if the numbers moved
        run: |
          python docs/generate_validation.py > /tmp/validation.md
          diff -q /tmp/validation.md docs/validation.md || {
            echo "docs/validation.md is stale - rerun docs/generate_validation.py"
            diff /tmp/validation.md docs/validation.md || true
            exit 1
          }
